# Copy this file to `.github/workflows/release.yml` in the repository.
# This session's GitHub token cannot create or update files under `.github/workflows`,
# so the workflow is stored here for manual placement.
#
# It builds Windows/macOS/Linux artifacts whenever a GitHub Release is published
# and uploads the `latest*.yml` metadata that electron-updater checks.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Package for ${{ matrix.target }}
        run: bunx electron-builder --${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
